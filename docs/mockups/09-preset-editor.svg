<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 390 844" width="390" height="844" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Segoe UI', Roboto, sans-serif">
    <defs>
        <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
            <stop offset="0%" stop-color="#050811"/>
            <stop offset="40%" stop-color="#080F22"/>
            <stop offset="100%" stop-color="#050811"/>
        </linearGradient>
        <radialGradient id="halo1" cx="0.85" cy="0.05" r="0.5">
            <stop offset="0%" stop-color="#B14EFF" stop-opacity="0.18"/>
            <stop offset="100%" stop-color="#B14EFF" stop-opacity="0"/>
        </radialGradient>
        <radialGradient id="halo2" cx="0.05" cy="1.0" r="0.6">
            <stop offset="0%" stop-color="#4EA1FF" stop-opacity="0.14"/>
            <stop offset="100%" stop-color="#4EA1FF" stop-opacity="0"/>
        </radialGradient>
        <linearGradient id="primary" x1="0" y1="0" x2="1" y2="1">
            <stop offset="0%" stop-color="#4EA1FF"/>
            <stop offset="100%" stop-color="#7BC1FF"/>
        </linearGradient>
    </defs>

    <rect width="390" height="844" fill="url(#bg)"/>
    <rect width="390" height="844" fill="url(#halo1)"/>
    <rect width="390" height="844" fill="url(#halo2)"/>

    <text x="32" y="34" fill="#E6ECF5" font-size="14" font-weight="600">9:41</text>
    <g transform="translate(330,22)" fill="#E6ECF5">
        <rect x="0" y="6" width="3" height="9" rx="1"/>
        <rect x="5" y="3" width="3" height="12" rx="1"/>
        <rect x="10" y="0" width="3" height="15" rx="1"/>
        <rect x="20" y="2" width="14" height="11" rx="2.5" fill="none" stroke="#E6ECF5" stroke-width="1.2"/>
        <rect x="22" y="4" width="10" height="7" rx="1"/>
    </g>

    <!-- Header -->
    <g transform="translate(20,68)">
        <text x="0" y="6" fill="#E6ECF5" font-size="20" font-weight="700">‹  Editor de preset</text>
    </g>

    <!-- Card detalles -->
    <g transform="translate(20,108)">
        <rect width="350" height="172" rx="18" fill="#16213A" stroke="#1E2D54"/>
        <text x="20" y="32" fill="#7B89A6" font-size="10" letter-spacing="2.5" font-weight="700">DETALLES</text>
        <text x="20" y="54" fill="#E6ECF5" font-size="18" font-weight="700">Nuevo preset</text>

        <text x="20" y="82" fill="#7B89A6" font-size="10" letter-spacing="2.5" font-weight="700">NOMBRE</text>
        <rect x="20" y="92" width="310" height="38" rx="11" fill="rgba(0,0,0,0.25)" stroke="#1E2D54"/>
        <text x="32" y="116" fill="#E6ECF5" font-size="14">Modo Cine</text>

        <text x="20" y="148" fill="#7B89A6" font-size="10" letter-spacing="2.5" font-weight="700">ICONO</text>
    </g>

    <!-- Icon picker (scroll horizontal) -->
    <g transform="translate(20,266)">
        <!-- icono 1 (selected) -->
        <g>
            <rect width="44" height="44" rx="14" fill="rgba(78,161,255,0.18)" stroke="#4EA1FF" stroke-width="1.4"/>
            <g transform="translate(13,15)" fill="none" stroke="#4EA1FF" stroke-width="1.5">
                <rect width="18" height="14" rx="1.5"/>
                <line x1="0" y1="3.5" x2="18" y2="3.5"/>
                <line x1="0" y1="10.5" x2="18" y2="10.5"/>
            </g>
        </g>
        <g transform="translate(52,0)">
            <rect width="44" height="44" rx="14" fill="rgba(255,255,255,0.03)" stroke="#1E2D54"/>
            <g transform="translate(14,14)" fill="none" stroke="#E6ECF5" stroke-width="1.5" stroke-linecap="round">
                <path d="M14 4 a8 8 0 1 0 0 12 a6 6 0 0 1 0 -12"/>
            </g>
        </g>
        <g transform="translate(104,0)">
            <rect width="44" height="44" rx="14" fill="rgba(255,255,255,0.03)" stroke="#1E2D54"/>
            <g transform="translate(13,14)" fill="none" stroke="#E6ECF5" stroke-width="1.5" stroke-linecap="round">
                <circle cx="9" cy="9" r="6"/>
                <line x1="9" y1="0" x2="9" y2="2"/>
                <line x1="9" y1="16" x2="9" y2="18"/>
                <line x1="0" y1="9" x2="2" y2="9"/>
                <line x1="16" y1="9" x2="18" y2="9"/>
            </g>
        </g>
        <g transform="translate(156,0)">
            <rect width="44" height="44" rx="14" fill="rgba(255,255,255,0.03)" stroke="#1E2D54"/>
            <g transform="translate(13,16)" fill="none" stroke="#E6ECF5" stroke-width="1.5">
                <path d="M0 8 L9 0 L18 8 a9 9 0 0 1 -18 0 Z" fill-opacity="0"/>
            </g>
        </g>
        <g transform="translate(208,0)">
            <rect width="44" height="44" rx="14" fill="rgba(255,255,255,0.03)" stroke="#1E2D54"/>
            <g transform="translate(13,15)" fill="none" stroke="#E6ECF5" stroke-width="1.5" stroke-linecap="round">
                <circle cx="9" cy="9" r="3"/>
                <path d="M9 12 v3 a3 3 0 0 1 -3 -3"/>
            </g>
        </g>
        <g transform="translate(260,0)">
            <rect width="44" height="44" rx="14" fill="rgba(255,255,255,0.03)" stroke="#1E2D54"/>
            <g transform="translate(15,15)" fill="none" stroke="#E6ECF5" stroke-width="1.5" stroke-linecap="round">
                <path d="M3 0 v9 a3 3 0 0 0 3 3 h2 a3 3 0 0 0 3 -3 V0"/>
                <line x1="6" y1="12" x2="6" y2="14"/>
            </g>
        </g>
        <g transform="translate(312,0)">
            <rect width="44" height="44" rx="14" fill="rgba(255,255,255,0.03)" stroke="#1E2D54"/>
            <g transform="translate(15,15)" fill="none" stroke="#E6ECF5" stroke-width="1.5" stroke-linecap="round">
                <polygon points="3,0 12,7 3,14" fill-opacity="0"/>
            </g>
        </g>
    </g>

    <!-- Card dispositivos -->
    <g transform="translate(20,328)">
        <rect width="350" height="380" rx="18" fill="#16213A" stroke="#1E2D54"/>

        <text x="20" y="28" fill="#7B89A6" font-size="10" letter-spacing="2.5" font-weight="700">2 SELECCIONADOS</text>
        <text x="20" y="50" fill="#E6ECF5" font-size="16" font-weight="700">Dispositivos</text>

        <!-- Grupo Salón -->
        <text x="20" y="80" fill="#7B89A6" font-size="9" letter-spacing="2" font-weight="700">SALÓN</text>

        <!-- Salón device 1 (seleccionado) -->
        <g transform="translate(14,90)">
            <rect width="322" height="76" rx="12" fill="rgba(78,161,255,0.10)" stroke="rgba(78,161,255,0.35)"/>
            <circle cx="14" cy="20" r="3" fill="#4EA1FF"/>
            <text x="24" y="24" fill="#E6ECF5" font-size="13" font-weight="700">autoroller-salon</text>
            <!-- check -->
            <circle cx="304" cy="20" r="9" fill="rgba(78,161,255,0.18)"/>
            <path d="M299 21 l3 3 L309 17" fill="none" stroke="#4EA1FF" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
            <!-- slider mini -->
            <text x="14" y="46" fill="#7B89A6" font-size="10">Posición: 100 %</text>
            <rect x="14" y="56" width="294" height="4" rx="2" fill="rgba(255,255,255,0.10)"/>
            <rect x="14" y="56" width="294" height="4" rx="2" fill="#4EA1FF"/>
            <circle cx="308" cy="58" r="6" fill="#4EA1FF"/>
        </g>

        <!-- Salón device 2 (seleccionado) -->
        <g transform="translate(14,178)">
            <rect width="322" height="76" rx="12" fill="rgba(78,161,255,0.10)" stroke="rgba(78,161,255,0.35)"/>
            <circle cx="14" cy="20" r="3" fill="#B14EFF"/>
            <text x="24" y="24" fill="#E6ECF5" font-size="13" font-weight="700">autoroller-velo</text>
            <circle cx="304" cy="20" r="9" fill="rgba(78,161,255,0.18)"/>
            <path d="M299 21 l3 3 L309 17" fill="none" stroke="#4EA1FF" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
            <text x="14" y="46" fill="#7B89A6" font-size="10">Posición: 80 %</text>
            <rect x="14" y="56" width="294" height="4" rx="2" fill="rgba(255,255,255,0.10)"/>
            <rect x="14" y="56" width="235" height="4" rx="2" fill="#B14EFF"/>
            <circle cx="249" cy="58" r="6" fill="#B14EFF"/>
        </g>

        <!-- Grupo Dormitorio -->
        <text x="20" y="278" fill="#7B89A6" font-size="9" letter-spacing="2" font-weight="700">DORMITORIO</text>

        <!-- Dormitorio device (no seleccionado) -->
        <g transform="translate(14,288)">
            <rect width="322" height="40" rx="12" fill="rgba(255,255,255,0.03)" stroke="#1E2D54"/>
            <circle cx="14" cy="20" r="3" fill="#4EFFB1"/>
            <text x="24" y="24" fill="#E6ECF5" font-size="13" font-weight="700">autoroller-dormitorio</text>
            <!-- + circle (no seleccionado) -->
            <circle cx="304" cy="20" r="9" fill="none" stroke="#7B89A6" stroke-width="1.4"/>
            <line x1="299" y1="20" x2="309" y2="20" stroke="#7B89A6" stroke-width="1.5" stroke-linecap="round"/>
            <line x1="304" y1="15" x2="304" y2="25" stroke="#7B89A6" stroke-width="1.5" stroke-linecap="round"/>
        </g>

        <text x="20" y="356" fill="#7B89A6" font-size="11">Toca un dispositivo para incluirlo. Ajusta su posición con el slider.</text>
    </g>

    <!-- Botones -->
    <g transform="translate(20,724)">
        <rect width="170" height="48" rx="14" fill="transparent" stroke="#1E2D54"/>
        <text x="85" y="30" text-anchor="middle" fill="#E6ECF5" font-size="14" font-weight="700">Cancelar</text>

        <rect x="180" y="0" width="170" height="48" rx="14" fill="url(#primary)"/>
        <text x="265" y="30" text-anchor="middle" fill="#061226" font-size="14" font-weight="700">Guardar</text>
    </g>
</svg>
