<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 390 844" width="390" height="844" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Segoe UI', Roboto, sans-serif">
    <defs>
        <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
            <stop offset="0%" stop-color="#050811"/>
            <stop offset="40%" stop-color="#080F22"/>
            <stop offset="100%" stop-color="#050811"/>
        </linearGradient>
        <radialGradient id="halo1" cx="0.85" cy="0.05" r="0.5">
            <stop offset="0%" stop-color="#B14EFF" stop-opacity="0.18"/>
            <stop offset="100%" stop-color="#B14EFF" stop-opacity="0"/>
        </radialGradient>
        <radialGradient id="halo2" cx="0.05" cy="1.0" r="0.6">
            <stop offset="0%" stop-color="#4EA1FF" stop-opacity="0.14"/>
            <stop offset="100%" stop-color="#4EA1FF" stop-opacity="0"/>
        </radialGradient>
        <linearGradient id="primary" x1="0" y1="0" x2="1" y2="1">
            <stop offset="0%" stop-color="#4EA1FF"/>
            <stop offset="100%" stop-color="#7BC1FF"/>
        </linearGradient>
    </defs>

    <rect width="390" height="844" fill="url(#bg)"/>
    <rect width="390" height="844" fill="url(#halo1)"/>
    <rect width="390" height="844" fill="url(#halo2)"/>

    <text x="32" y="34" fill="#E6ECF5" font-size="14" font-weight="600">9:41</text>
    <g transform="translate(330,22)" fill="#E6ECF5">
        <rect x="0" y="6" width="3" height="9" rx="1"/>
        <rect x="5" y="3" width="3" height="12" rx="1"/>
        <rect x="10" y="0" width="3" height="15" rx="1"/>
        <rect x="20" y="2" width="14" height="11" rx="2.5" fill="none" stroke="#E6ECF5" stroke-width="1.2"/>
        <rect x="22" y="4" width="10" height="7" rx="1"/>
    </g>

    <!-- Header -->
    <g transform="translate(20,68)">
        <text x="0" y="6" fill="#E6ECF5" font-size="20" font-weight="700">‹</text>
        <text x="32" y="2" fill="#E6ECF5" font-size="17" font-weight="700">autoroller-salon</text>
        <text x="32" y="22" fill="#7B89A6" font-size="12">192.168.1.42</text>
        <g transform="translate(216,4)">
            <rect width="48" height="22" rx="11" fill="rgba(78,255,177,0.12)"/>
            <circle cx="9" cy="11" r="3" fill="#4EFFB1"/>
            <text x="17" y="15" fill="#4EFFB1" font-size="10" font-weight="700">REPOSO</text>
        </g>
    </g>

    <!-- Tabs -->
    <g transform="translate(20,116)">
        <rect width="350" height="40" rx="14" fill="rgba(255,255,255,0.03)" stroke="#1E2D54"/>
        <text x="46"  y="24" text-anchor="middle" fill="#7B89A6" font-size="11" font-weight="700">Control</text>
        <text x="133" y="24" text-anchor="middle" fill="#7B89A6" font-size="11" font-weight="700">Programador</text>
        <text x="220" y="24" text-anchor="middle" fill="#7B89A6" font-size="11" font-weight="700">Ajustes</text>
        <rect x="265" y="4" width="83" height="32" rx="11" fill="rgba(78,161,255,0.18)"/>
        <text x="307" y="24" text-anchor="middle" fill="#4EA1FF" font-size="11" font-weight="700">Avanzado</text>
    </g>

    <!-- Calibración -->
    <g transform="translate(20,178)">
        <rect width="350" height="146" rx="18" fill="#16213A" stroke="#1E2D54"/>
        <text x="20" y="32" fill="#7B89A6" font-size="10" letter-spacing="2.5" font-weight="700">EDITAR</text>
        <text x="20" y="54" fill="#E6ECF5" font-size="18" font-weight="700">Calibración</text>
        <text x="20" y="78" fill="#7B89A6" font-size="12">Lanza una rutina entre topes para que el</text>
        <text x="20" y="94" fill="#7B89A6" font-size="12">nodo aprenda el recorrido total.</text>
        <rect x="20" y="106" width="310" height="24" rx="11" fill="url(#primary)"/>
        <text x="175" y="123" text-anchor="middle" fill="#061226" font-size="13" font-weight="700">⤢ Calibrar ahora</text>
    </g>

    <!-- Bluetooth (radios) -->
    <g transform="translate(20,344)">
        <rect width="350" height="294" rx="18" fill="#16213A" stroke="#1E2D54"/>
        <text x="20" y="32" fill="#E6ECF5" font-size="18" font-weight="700">Bluetooth</text>
        <text x="20" y="56" fill="#7B89A6" font-size="10" letter-spacing="2.5" font-weight="700">POLÍTICA</text>

        <!-- Opción 1 (selected) -->
        <g transform="translate(20,68)">
            <text x="0"   y="14" fill="#E6ECF5" font-size="14" font-weight="700">Siempre</text>
            <text x="0"   y="32" fill="#7B89A6" font-size="11">BLE encendido siempre (recomendado)</text>
            <circle cx="298" cy="20" r="11" fill="none" stroke="#4EA1FF" stroke-width="1.6"/>
            <circle cx="298" cy="20" r="5" fill="#4EA1FF"/>
        </g>
        <line x1="20" y1="120" x2="330" y2="120" stroke="#1E2D54" stroke-width="1"/>

        <g transform="translate(20,128)">
            <text x="0"   y="14" fill="#E6ECF5" font-size="14" font-weight="700">Hasta WiFi</text>
            <text x="0"   y="32" fill="#7B89A6" font-size="11">Apagar al conectar a WiFi</text>
            <circle cx="298" cy="20" r="11" fill="none" stroke="#1E2D54" stroke-width="1.6"/>
        </g>
        <line x1="20" y1="180" x2="330" y2="180" stroke="#1E2D54" stroke-width="1"/>

        <g transform="translate(20,188)">
            <text x="0"   y="14" fill="#E6ECF5" font-size="14" font-weight="700">5 minutos</text>
            <text x="0"   y="32" fill="#7B89A6" font-size="11">Apagar 5 min tras arrancar</text>
            <circle cx="298" cy="20" r="11" fill="none" stroke="#1E2D54" stroke-width="1.6"/>
        </g>
        <line x1="20" y1="240" x2="330" y2="240" stroke="#1E2D54" stroke-width="1"/>

        <g transform="translate(20,248)">
            <text x="0"   y="14" fill="#E6ECF5" font-size="14" font-weight="700">Apagado</text>
            <text x="0"   y="32" fill="#7B89A6" font-size="11">BLE deshabilitado</text>
            <circle cx="298" cy="20" r="11" fill="none" stroke="#1E2D54" stroke-width="1.6"/>
        </g>
    </g>

    <!-- Reconfigurar BLE + Mantenimiento -->
    <g transform="translate(20,658)">
        <rect width="350" height="160" rx="18" fill="#16213A" stroke="#1E2D54"/>
        <text x="20" y="32" fill="#E6ECF5" font-size="18" font-weight="700">Mantenimiento</text>

        <!-- Reconfigurar -->
        <rect x="20" y="46" width="310" height="36" rx="11" fill="rgba(255,255,255,0.04)" stroke="#1E2D54"/>
        <text x="175" y="69" text-anchor="middle" fill="#E6ECF5" font-size="13" font-weight="700">⚏ Reconfigurar por Bluetooth</text>

        <!-- Reiniciar / Olvidar wifi -->
        <rect x="20"  y="92" width="148" height="36" rx="11" fill="rgba(255,255,255,0.04)" stroke="#1E2D54"/>
        <text x="94"  y="115" text-anchor="middle" fill="#E6ECF5" font-size="13" font-weight="700">Reiniciar</text>
        <rect x="182" y="92" width="148" height="36" rx="11" fill="rgba(255,176,78,0.10)" stroke="rgba(255,176,78,0.40)"/>
        <text x="256" y="115" text-anchor="middle" fill="#FFB04E" font-size="13" font-weight="700">Olvidar WiFi</text>

        <!-- Reset fábrica -->
        <rect x="20"  y="138" width="310" height="0" rx="11"/>
    </g>
</svg>
