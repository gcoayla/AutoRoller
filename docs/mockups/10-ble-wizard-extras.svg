<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 390 844" width="390" height="844" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Segoe UI', Roboto, sans-serif">
    <defs>
        <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
            <stop offset="0%" stop-color="#050811"/>
            <stop offset="40%" stop-color="#080F22"/>
            <stop offset="100%" stop-color="#050811"/>
        </linearGradient>
        <radialGradient id="halo1" cx="0.85" cy="0.05" r="0.5">
            <stop offset="0%" stop-color="#B14EFF" stop-opacity="0.18"/>
            <stop offset="100%" stop-color="#B14EFF" stop-opacity="0"/>
        </radialGradient>
        <radialGradient id="halo2" cx="0.05" cy="1.0" r="0.6">
            <stop offset="0%" stop-color="#4EA1FF" stop-opacity="0.14"/>
            <stop offset="100%" stop-color="#4EA1FF" stop-opacity="0"/>
        </radialGradient>
        <linearGradient id="primary" x1="0" y1="0" x2="1" y2="1">
            <stop offset="0%" stop-color="#4EA1FF"/>
            <stop offset="100%" stop-color="#7BC1FF"/>
        </linearGradient>
    </defs>

    <rect width="390" height="844" fill="url(#bg)"/>
    <rect width="390" height="844" fill="url(#halo1)"/>
    <rect width="390" height="844" fill="url(#halo2)"/>

    <text x="32" y="34" fill="#E6ECF5" font-size="14" font-weight="600">9:41</text>
    <g transform="translate(330,22)" fill="#E6ECF5">
        <rect x="0" y="6" width="3" height="9" rx="1"/>
        <rect x="5" y="3" width="3" height="12" rx="1"/>
        <rect x="10" y="0" width="3" height="15" rx="1"/>
        <rect x="20" y="2" width="14" height="11" rx="2.5" fill="none" stroke="#E6ECF5" stroke-width="1.2"/>
        <rect x="22" y="4" width="10" height="7" rx="1"/>
    </g>

    <!-- Header -->
    <text x="20" y="74" fill="#E6ECF5" font-size="20" font-weight="700">‹  Configuración inicial</text>

    <!-- Stepper: 4 done, paso 4 activo (Extras) -->
    <g transform="translate(20,108)">
        <!-- 1 Conectar (done) -->
        <circle cx="14" cy="14" r="14" fill="rgba(78,255,177,0.20)" stroke="#4EFFB1" stroke-width="1.4"/>
        <path d="M9 15 l3.5 3.5 L20 11" fill="none" stroke="#4EFFB1" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
        <text x="14" y="50" text-anchor="middle" fill="#7B89A6" font-size="9">Conectar</text>
        <line x1="30" y1="14" x2="80" y2="14" stroke="#4EFFB1" stroke-width="1.5"/>

        <g transform="translate(80,0)">
            <circle cx="14" cy="14" r="14" fill="rgba(78,255,177,0.20)" stroke="#4EFFB1" stroke-width="1.4"/>
            <path d="M9 15 l3.5 3.5 L20 11" fill="none" stroke="#4EFFB1" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
            <text x="14" y="50" text-anchor="middle" fill="#7B89A6" font-size="9">Identidad</text>
        </g>
        <line x1="110" y1="14" x2="160" y2="14" stroke="#4EFFB1" stroke-width="1.5"/>

        <g transform="translate(160,0)">
            <circle cx="14" cy="14" r="14" fill="rgba(78,255,177,0.20)" stroke="#4EFFB1" stroke-width="1.4"/>
            <path d="M9 15 l3.5 3.5 L20 11" fill="none" stroke="#4EFFB1" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
            <text x="14" y="50" text-anchor="middle" fill="#7B89A6" font-size="9">WiFi</text>
        </g>
        <line x1="190" y1="14" x2="240" y2="14" stroke="#4EFFB1" stroke-width="1.5"/>

        <!-- Extras (active) -->
        <g transform="translate(240,0)">
            <circle cx="14" cy="14" r="14" fill="rgba(78,161,255,0.20)" stroke="#4EA1FF" stroke-width="1.4"/>
            <text x="14" y="18" text-anchor="middle" fill="#4EA1FF" font-size="11" font-weight="700">4</text>
            <text x="14" y="50" text-anchor="middle" fill="#E6ECF5" font-size="9">Extras</text>
        </g>
        <line x1="270" y1="14" x2="320" y2="14" stroke="#1E2D54" stroke-width="1.5"/>

        <g transform="translate(320,0)">
            <circle cx="14" cy="14" r="14" fill="rgba(255,255,255,0.05)" stroke="#1E2D54" stroke-width="1.4"/>
            <text x="14" y="18" text-anchor="middle" fill="#7B89A6" font-size="11" font-weight="700">5</text>
            <text x="14" y="50" text-anchor="middle" fill="#7B89A6" font-size="9">Listo</text>
        </g>
    </g>

    <!-- Card: Límites de recorrido -->
    <g transform="translate(20,184)">
        <rect width="350" height="216" rx="18" fill="#16213A" stroke="#1E2D54"/>
        <text x="20" y="32" fill="#7B89A6" font-size="10" letter-spacing="2.5" font-weight="700">PASO 3 DE 3 · SEGURIDAD</text>
        <text x="20" y="54" fill="#E6ECF5" font-size="16" font-weight="700">Límites de recorrido</text>
        <text x="20" y="76" fill="#7B89A6" font-size="12">Define hasta dónde puede subir y bajar para</text>
        <text x="20" y="92" fill="#7B89A6" font-size="12">no forzar la cortina. Se pueden ajustar luego.</text>

        <!-- Tope abierto -->
        <text x="20" y="116" fill="#7B89A6" font-size="9" letter-spacing="2" font-weight="700">TOPE ABIERTO</text>
        <text x="328" y="118" text-anchor="end" fill="#E6ECF5" font-size="13" font-family="ui-monospace, monospace">5 %</text>
        <rect x="20" y="128" width="310" height="6" rx="3" fill="#4EA1FF"/>
        <rect x="20" y="128" width="16" height="6" rx="3" fill="rgba(255,255,255,0.10)"/>
        <circle cx="36" cy="131" r="9" fill="#4EA1FF"/>

        <!-- Tope cerrado -->
        <text x="20" y="166" fill="#7B89A6" font-size="9" letter-spacing="2" font-weight="700">TOPE CERRADO</text>
        <text x="328" y="168" text-anchor="end" fill="#E6ECF5" font-size="13" font-family="ui-monospace, monospace">95 %</text>
        <rect x="20" y="178" width="310" height="6" rx="3" fill="rgba(255,255,255,0.10)"/>
        <rect x="20" y="178" width="294" height="6" rx="3" fill="#4EA1FF"/>
        <circle cx="314" cy="181" r="9" fill="#4EA1FF"/>
    </g>

    <!-- Card: Habitación -->
    <g transform="translate(20,416)">
        <rect width="350" height="124" rx="18" fill="#16213A" stroke="#1E2D54"/>
        <text x="20" y="32" fill="#7B89A6" font-size="10" letter-spacing="2.5" font-weight="700">OPCIONAL</text>
        <text x="20" y="54" fill="#E6ECF5" font-size="16" font-weight="700">Habitación</text>

        <!-- Chips -->
        <g transform="translate(20,68)">
            <!-- Sin hab -->
            <rect width="92" height="32" rx="11" fill="rgba(255,255,255,0.04)" stroke="#1E2D54"/>
            <text x="46" y="20" text-anchor="middle" fill="#7B89A6" font-size="11" font-weight="700">Sin habitación</text>

            <!-- Salón (selected) -->
            <g transform="translate(100,0)">
                <rect width="68" height="32" rx="11" fill="rgba(78,161,255,0.18)" stroke="#4EA1FF"/>
                <g transform="translate(8,11)" fill="none" stroke="#4EA1FF" stroke-width="1.4">
                    <path d="M0 7 L7 1 L14 7 V12 H0 Z"/>
                </g>
                <text x="46" y="20" text-anchor="middle" fill="#4EA1FF" font-size="11" font-weight="700">Salón</text>
            </g>

            <!-- Cocina -->
            <g transform="translate(176,0)">
                <rect width="76" height="32" rx="11" fill="rgba(255,255,255,0.04)" stroke="#1E2D54"/>
                <g transform="translate(10,11)" fill="none" stroke="#7B89A6" stroke-width="1.4" stroke-linecap="round">
                    <path d="M2 0 L2 6 a3 3 0 0 0 3 3 V14"/>
                    <path d="M9 0 V14 M9 0 a2 2 0 0 1 2 2 V6 a2 2 0 0 1 -2 2"/>
                </g>
                <text x="46" y="20" text-anchor="middle" fill="#E6ECF5" font-size="11" font-weight="700">Cocina</text>
            </g>

            <!-- Dormitorio -->
            <g transform="translate(260,0)">
                <rect width="92" height="32" rx="11" fill="rgba(255,255,255,0.04)" stroke="#1E2D54"/>
                <g transform="translate(8,15)" fill="none" stroke="#7B89A6" stroke-width="1.4" stroke-linecap="round">
                    <path d="M2 7 H12 V5 a2 2 0 0 0 -2 -2 H4 a2 2 0 0 0 -2 2 Z"/>
                    <line x1="0" y1="7" x2="0" y2="9"/>
                    <line x1="14" y1="7" x2="14" y2="9"/>
                </g>
                <text x="50" y="20" text-anchor="middle" fill="#E6ECF5" font-size="11" font-weight="700">Dormitorio</text>
            </g>
        </g>
    </g>

    <!-- Card: MQTT (colapsado, off) -->
    <g transform="translate(20,556)">
        <rect width="350" height="74" rx="18" fill="#16213A" stroke="#1E2D54"/>
        <text x="20" y="32" fill="#7B89A6" font-size="10" letter-spacing="2.5" font-weight="700">OPCIONAL</text>
        <text x="20" y="54" fill="#E6ECF5" font-size="16" font-weight="700">MQTT</text>
        <!-- Switch off -->
        <g transform="translate(290,30)">
            <rect width="40" height="22" rx="11" fill="rgba(255,255,255,0.12)"/>
            <circle cx="11" cy="11" r="9" fill="#777"/>
        </g>
    </g>

    <!-- Card: Hora + botón finalizar -->
    <g transform="translate(20,646)">
        <rect width="350" height="148" rx="18" fill="#16213A" stroke="#1E2D54"/>
        <text x="20" y="32" fill="#E6ECF5" font-size="16" font-weight="700">Hora / NTP</text>

        <text x="20" y="56" fill="#7B89A6" font-size="9" letter-spacing="2" font-weight="700">ZONA HORARIA (POSIX)</text>
        <rect x="20" y="64" width="310" height="32" rx="11" fill="rgba(0,0,0,0.25)" stroke="#1E2D54"/>
        <text x="32" y="84" fill="#E6ECF5" font-size="12" font-family="ui-monospace, monospace">CET-1CEST,M3.5.0/2,M10.5.0/3</text>

        <rect x="20" y="106" width="310" height="32" rx="11" fill="url(#primary)"/>
        <text x="175" y="126" text-anchor="middle" fill="#061226" font-size="14" font-weight="700">Finalizar</text>
    </g>
</svg>
