<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 390 844" width="390" height="844" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Segoe UI', Roboto, sans-serif">
    <defs>
        <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
            <stop offset="0%"   stop-color="#050811"/>
            <stop offset="40%"  stop-color="#080F22"/>
            <stop offset="100%" stop-color="#050811"/>
        </linearGradient>
        <radialGradient id="halo1" cx="0.85" cy="0.05" r="0.5">
            <stop offset="0%"   stop-color="#B14EFF" stop-opacity="0.18"/>
            <stop offset="100%" stop-color="#B14EFF" stop-opacity="0"/>
        </radialGradient>
        <radialGradient id="halo2" cx="0.05" cy="1.0" r="0.6">
            <stop offset="0%"   stop-color="#4EA1FF" stop-opacity="0.14"/>
            <stop offset="100%" stop-color="#4EA1FF" stop-opacity="0"/>
        </radialGradient>
        <linearGradient id="cardA" x1="0" y1="0" x2="1" y2="1">
            <stop offset="0%"   stop-color="#4EA1FF" stop-opacity="0.16"/>
            <stop offset="100%" stop-color="#4EA1FF" stop-opacity="0"/>
        </linearGradient>
        <linearGradient id="cardB" x1="0" y1="0" x2="1" y2="1">
            <stop offset="0%"   stop-color="#B14EFF" stop-opacity="0.16"/>
            <stop offset="100%" stop-color="#B14EFF" stop-opacity="0"/>
        </linearGradient>
        <linearGradient id="cardC" x1="0" y1="0" x2="1" y2="1">
            <stop offset="0%"   stop-color="#4EFFB1" stop-opacity="0.14"/>
            <stop offset="100%" stop-color="#4EFFB1" stop-opacity="0"/>
        </linearGradient>
        <linearGradient id="fab" x1="0" y1="0" x2="1" y2="1">
            <stop offset="0%"   stop-color="#4EA1FF"/>
            <stop offset="100%" stop-color="#B14EFF"/>
        </linearGradient>
    </defs>

    <!-- Fondo -->
    <rect width="390" height="844" fill="url(#bg)"/>
    <rect width="390" height="844" fill="url(#halo1)"/>
    <rect width="390" height="844" fill="url(#halo2)"/>

    <!-- Status bar -->
    <text x="32" y="34" fill="#E6ECF5" font-size="14" font-weight="600">9:41</text>
    <g transform="translate(330,22)" fill="#E6ECF5">
        <rect x="0"  y="6" width="3"  height="9"  rx="1"/>
        <rect x="5"  y="3" width="3"  height="12" rx="1"/>
        <rect x="10" y="0" width="3"  height="15" rx="1"/>
        <rect x="20" y="2" width="14" height="11" rx="2.5" fill="none" stroke="#E6ECF5" stroke-width="1.2"/>
        <rect x="22" y="4" width="10" height="7"  rx="1"/>
        <rect x="35" y="5" width="2"  height="5"  rx="1"/>
    </g>

    <!-- Header -->
    <text x="20" y="78" fill="#7B89A6" font-size="11" letter-spacing="2.5" font-weight="600">ESTACIÓN DE CONTROL</text>
    <text x="20" y="108" fill="#E6ECF5" font-size="30" font-weight="800">AutoRoller</text>
    <text x="20" y="130" fill="#7B89A6" font-size="13">3 dispositivos · 3 online</text>

    <!-- Botón ajustes -->
    <g transform="translate(338,86)">
        <rect width="40" height="40" rx="20" fill="rgba(255,255,255,0.04)" stroke="#1E2D54" stroke-width="1"/>
        <g transform="translate(20,20)" fill="none" stroke="#E6ECF5" stroke-width="1.6" stroke-linecap="round">
            <circle cx="0" cy="0" r="3"/>
            <path d="M0 -8 v3 M0 8 v-3 M-8 0 h3 M8 0 h-3 M-5.7 -5.7 l2.1 2.1 M5.7 5.7 l-2.1 -2.1 M-5.7 5.7 l2.1 -2.1 M5.7 -5.7 l-2.1 2.1"/>
        </g>
    </g>

    <!-- Card: Control de grupo -->
    <g transform="translate(20,158)">
        <rect width="350" height="100" rx="18" fill="#16213A" stroke="#1E2D54"/>
        <text x="20" y="32" fill="#7B89A6" font-size="10" letter-spacing="2.5" font-weight="700">CONTROL DE GRUPO</text>

        <!-- Subir todo (gradient) -->
        <g transform="translate(20,46)">
            <rect width="100" height="40" rx="12" fill="url(#fab)"/>
            <text x="50" y="25" text-anchor="middle" fill="#061226" font-size="13" font-weight="700">▲ Subir todo</text>
        </g>
        <!-- Parar (warn) -->
        <g transform="translate(125,46)">
            <rect width="100" height="40" rx="12" fill="rgba(255,176,78,0.10)" stroke="rgba(255,176,78,0.40)"/>
            <text x="50" y="25" text-anchor="middle" fill="#FFB04E" font-size="13" font-weight="700">■ Parar</text>
        </g>
        <!-- Bajar todo (gradient) -->
        <g transform="translate(230,46)">
            <rect width="100" height="40" rx="12" fill="url(#fab)"/>
            <text x="50" y="25" text-anchor="middle" fill="#061226" font-size="13" font-weight="700">▼ Bajar todo</text>
        </g>
    </g>

    <!-- Device card 1: Salón -->
    <g transform="translate(20,278)">
        <rect width="350" height="148" rx="18" fill="#16213A" stroke="#1E2D54"/>
        <rect width="350" height="148" rx="18" fill="url(#cardA)"/>

        <!-- Dot + nombre -->
        <circle cx="22" cy="26" r="4" fill="#4EA1FF"/>
        <text x="34" y="30" fill="#E6ECF5" font-size="16" font-weight="700">autoroller-salon</text>
        <text x="170" y="30" fill="#FFB04E" font-size="11">★</text>

        <!-- Pill estado -->
        <g transform="translate(265,16)">
            <rect width="68" height="22" rx="11" fill="rgba(78,161,255,0.16)"/>
            <circle cx="14" cy="11" r="3" fill="#4EA1FF"/>
            <text x="22" y="15" fill="#4EA1FF" font-size="10" font-weight="700">SUBIENDO</text>
        </g>

        <!-- IP / RSSI -->
        <text x="34" y="50" fill="#7B89A6" font-size="11">192.168.1.42 · -52 dBm</text>

        <!-- Barra de posición -->
        <rect x="22" y="76" width="306" height="6" rx="3" fill="rgba(255,255,255,0.08)"/>
        <rect x="22" y="76" width="116" height="6" rx="3" fill="#4EA1FF"/>
        <text x="22" y="100" fill="#7B89A6" font-size="11">38 % cerrada</text>
        <text x="328" y="100" text-anchor="end" fill="#7B89A6" font-size="11">Calibrada</text>

        <!-- Acciones rápidas -->
        <g transform="translate(22,114)">
            <rect width="98"  height="24" rx="8" fill="rgba(78,161,255,0.10)" stroke="rgba(78,161,255,0.25)"/>
            <text x="49" y="16" text-anchor="middle" fill="#4EA1FF" font-size="11" font-weight="700">▲ Subir</text>
        </g>
        <g transform="translate(126,114)">
            <rect width="98"  height="24" rx="8" fill="rgba(255,176,78,0.10)" stroke="rgba(255,176,78,0.25)"/>
            <text x="49" y="16" text-anchor="middle" fill="#FFB04E" font-size="11" font-weight="700">■ Parar</text>
        </g>
        <g transform="translate(230,114)">
            <rect width="98"  height="24" rx="8" fill="rgba(78,161,255,0.10)" stroke="rgba(78,161,255,0.25)"/>
            <text x="49" y="16" text-anchor="middle" fill="#4EA1FF" font-size="11" font-weight="700">▼ Bajar</text>
        </g>
    </g>

    <!-- Device card 2: Cocina -->
    <g transform="translate(20,442)">
        <rect width="350" height="148" rx="18" fill="#16213A" stroke="#1E2D54"/>
        <rect width="350" height="148" rx="18" fill="url(#cardB)"/>

        <circle cx="22" cy="26" r="4" fill="#B14EFF"/>
        <text x="34" y="30" fill="#E6ECF5" font-size="16" font-weight="700">autoroller-cocina</text>

        <g transform="translate(284,16)">
            <rect width="48" height="22" rx="11" fill="rgba(78,255,177,0.12)"/>
            <circle cx="9" cy="11" r="3" fill="#4EFFB1"/>
            <text x="17" y="15" fill="#4EFFB1" font-size="10" font-weight="700">REPOSO</text>
        </g>

        <text x="34" y="50" fill="#7B89A6" font-size="11">192.168.1.43 · -61 dBm</text>

        <rect x="22" y="76" width="306" height="6" rx="3" fill="rgba(255,255,255,0.08)"/>
        <rect x="22" y="76" width="306" height="6" rx="3" fill="#B14EFF"/>
        <text x="22" y="100" fill="#7B89A6" font-size="11">100 % cerrada</text>
        <text x="328" y="100" text-anchor="end" fill="#7B89A6" font-size="11">Calibrada</text>

        <g transform="translate(22,114)">
            <rect width="98" height="24" rx="8" fill="rgba(177,78,255,0.10)" stroke="rgba(177,78,255,0.25)"/>
            <text x="49" y="16" text-anchor="middle" fill="#B14EFF" font-size="11" font-weight="700">▲ Subir</text>
        </g>
        <g transform="translate(126,114)">
            <rect width="98" height="24" rx="8" fill="rgba(255,176,78,0.10)" stroke="rgba(255,176,78,0.25)"/>
            <text x="49" y="16" text-anchor="middle" fill="#FFB04E" font-size="11" font-weight="700">■ Parar</text>
        </g>
        <g transform="translate(230,114)">
            <rect width="98" height="24" rx="8" fill="rgba(177,78,255,0.10)" stroke="rgba(177,78,255,0.25)"/>
            <text x="49" y="16" text-anchor="middle" fill="#B14EFF" font-size="11" font-weight="700">▼ Bajar</text>
        </g>
    </g>

    <!-- Device card 3: Dormitorio -->
    <g transform="translate(20,606)">
        <rect width="350" height="148" rx="18" fill="#16213A" stroke="#1E2D54"/>
        <rect width="350" height="148" rx="18" fill="url(#cardC)"/>

        <circle cx="22" cy="26" r="4" fill="#4EFFB1"/>
        <text x="34" y="30" fill="#E6ECF5" font-size="16" font-weight="700">autoroller-dormitorio</text>

        <g transform="translate(284,16)">
            <rect width="48" height="22" rx="11" fill="rgba(78,255,177,0.12)"/>
            <circle cx="9" cy="11" r="3" fill="#4EFFB1"/>
            <text x="17" y="15" fill="#4EFFB1" font-size="10" font-weight="700">REPOSO</text>
        </g>

        <text x="34" y="50" fill="#7B89A6" font-size="11">192.168.1.44 · -68 dBm</text>

        <rect x="22" y="76" width="306" height="6" rx="3" fill="rgba(255,255,255,0.08)"/>
        <rect x="22" y="76" width="0" height="6" rx="3" fill="#4EFFB1"/>
        <text x="22" y="100" fill="#7B89A6" font-size="11">0 % cerrada</text>
        <text x="328" y="100" text-anchor="end" fill="#7B89A6" font-size="11">Calibrada</text>

        <g transform="translate(22,114)">
            <rect width="98" height="24" rx="8" fill="rgba(78,255,177,0.10)" stroke="rgba(78,255,177,0.25)"/>
            <text x="49" y="16" text-anchor="middle" fill="#4EFFB1" font-size="11" font-weight="700">▲ Subir</text>
        </g>
        <g transform="translate(126,114)">
            <rect width="98" height="24" rx="8" fill="rgba(255,176,78,0.10)" stroke="rgba(255,176,78,0.25)"/>
            <text x="49" y="16" text-anchor="middle" fill="#FFB04E" font-size="11" font-weight="700">■ Parar</text>
        </g>
        <g transform="translate(230,114)">
            <rect width="98" height="24" rx="8" fill="rgba(78,255,177,0.10)" stroke="rgba(78,255,177,0.25)"/>
            <text x="49" y="16" text-anchor="middle" fill="#4EFFB1" font-size="11" font-weight="700">▼ Bajar</text>
        </g>
    </g>

    <!-- FAB -->
    <g transform="translate(310,750)">
        <circle cx="30" cy="30" r="32" fill="#050811"/>
        <circle cx="30" cy="30" r="30" fill="url(#fab)"/>
        <text x="30" y="40" text-anchor="middle" fill="#061226" font-size="32" font-weight="700">+</text>
    </g>
</svg>
