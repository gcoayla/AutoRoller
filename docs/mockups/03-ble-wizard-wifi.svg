            <rect x="5"  width="3" height="7"  rx="1.5" fill="#4EA1FF"/>
            <rect x="10" width="3" height="10" rx="1.5" fill="#4EA1FF"/>
            <rect x="15" width="3" height="13" rx="1.5" fill="#4EA1FF"/>
        </g>
        <circle cx="306" cy="108" r="9" fill="none" stroke="#4EA1FF" stroke-width="1.5"/>
        <path d="M301 109 l3.5 3.5 L312 105" fill="none" stroke="#4EA1FF" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/>

        <line x1="20" y1="140" x2="330" y2="140" stroke="#1E2D54" stroke-width="1"/>
        <text x="20" y="166" fill="#E6ECF5" font-size="14" font-weight="700">Vecino-WiFi</text>
        <text x="20" y="184" fill="#7B89A6" font-size="11">Canal 11 · Protegida</text>
        <g transform="translate(258,158)">
            <rect width="3" height="4"  rx="1.5" fill="#4EA1FF"/>
            <rect x="5"  width="3" height="7"  rx="1.5" fill="#4EA1FF"/>
            <rect x="10" width="3" height="10" rx="1.5" fill="#4EA1FF"/>
            <rect x="15" width="3" height="13" rx="1.5" fill="rgba(255,255,255,0.18)"/>
        </g>

        <line x1="20" y1="200" x2="330" y2="200" stroke="#1E2D54" stroke-width="1"/>
        <text x="20" y="226" fill="#E6ECF5" font-size="14" font-weight="700">Cafetería_Open</text>
        <text x="20" y="244" fill="#7B89A6" font-size="11">Canal 1 · Abierta</text>
        <g transform="translate(258,218)">
            <rect width="3" height="4"  rx="1.5" fill="#4EA1FF"/>
            <rect x="5"  width="3" height="7"  rx="1.5" fill="#4EA1FF"/>
            <rect x="10" width="3" height="10" rx="1.5" fill="rgba(255,255,255,0.18)"/>
            <rect x="15" width="3" height="13" rx="1.5" fill="rgba(255,255,255,0.18)"/>
        </g>

        <line x1="20" y1="260" x2="330" y2="260" stroke="#1E2D54" stroke-width="1"/>
        <text x="20" y="286" fill="#E6ECF5" font-size="14" font-weight="700">Movistar_3F2A</text>
        <text x="20" y="304" fill="#7B89A6" font-size="11">Canal 6 · Protegida</text>
        <g transform="translate(258,278)">
            <rect width="3" height="4"  rx="1.5" fill="#4EA1FF"/>
            <rect x="5"  width="3" height="7"  rx="1.5" fill="rgba(255,255,255,0.18)"/>
            <rect x="10" width="3" height="10" rx="1.5" fill="rgba(255,255,255,0.18)"/>
            <rect x="15" width="3" height="13" rx="1.5" fill="rgba(255,255,255,0.18)"/>
        </g>
