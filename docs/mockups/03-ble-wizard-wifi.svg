        <g transform="translate(160,0)">
            <circle cx="14" cy="14" r="14" fill="rgba(78,161,255,0.20)" stroke="#4EA1FF" stroke-width="1.4"/>
            <text x="14" y="18" text-anchor="middle" fill="#4EA1FF" font-size="11" font-weight="700">3</text>
            <text x="14" y="50" text-anchor="middle" fill="#E6ECF5" font-size="9">WiFi</text>
        </g>
        <line x1="190" y1="14" x2="240" y2="14" stroke="#1E2D54" stroke-width="1.5"/>

        <!-- Extras -->
        <g transform="translate(240,0)">
            <circle cx="14" cy="14" r="14" fill="rgba(255,255,255,0.05)" stroke="#1E2D54" stroke-width="1.4"/>
            <text x="14" y="18" text-anchor="middle" fill="#7B89A6" font-size="11" font-weight="700">4</text>
            <text x="14" y="50" text-anchor="middle" fill="#7B89A6" font-size="9">Extras</text>
        </g>
        <line x1="270" y1="14" x2="320" y2="14" stroke="#1E2D54" stroke-width="1.5"/>

