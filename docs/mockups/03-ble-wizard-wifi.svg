    <!-- Card de inputs -->
    <g transform="translate(20,524)">
        <rect width="350" height="280" rx="18" fill="#16213A" stroke="#1E2D54"/>

        <text x="20" y="32" fill="#7B89A6" font-size="10" letter-spacing="2.5" font-weight="700">SSID</text>
        <rect x="20" y="42" width="310" height="42" rx="11" fill="rgba(0,0,0,0.25)" stroke="#1E2D54"/>
        <text x="32" y="68" fill="#E6ECF5" font-size="14">MiWiFi</text>

        <text x="20" y="108" fill="#7B89A6" font-size="10" letter-spacing="2.5" font-weight="700">CONTRASEÑA</text>
        <rect x="20" y="118" width="310" height="42" rx="11" fill="rgba(0,0,0,0.25)" stroke="#1E2D54"/>
        <text x="32" y="144" fill="#E6ECF5" font-size="14" letter-spacing="3">●●●●●●●●●●●</text>

        <!-- Botón -->
        <rect x="20" y="194" width="310" height="48" rx="14" fill="url(#primary)"/>
        <text x="175" y="223" text-anchor="middle" fill="#061226" font-size="15" font-weight="700">Conectar</text>
    </g>
</svg>
