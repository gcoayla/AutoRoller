        <!-- Network 1 (selected) -->
        <line x1="20" y1="80" x2="330" y2="80" stroke="#1E2D54" stroke-width="1"/>
        <text x="20" y="106" fill="#E6ECF5" font-size="14" font-weight="700">MiWiFi</text>
        <text x="20" y="124" fill="#7B89A6" font-size="11">Canal 6 · Protegida</text>
        <g transform="translate(258,98)">
